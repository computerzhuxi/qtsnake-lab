<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Arena — UI Mockup v1</title>
<style>
  /* ============================================================
     TRON Dark Theme — per docs/design.md §2
     ============================================================ */
  :root {
    --bg-deep:    #06060f;
    --bg-panel:   #0a0a1a;
    --bg-btn:     #0d0d28;
    --border-btn: #222255;
    --border-hl:  #00ff88;
    --text-main:  #ccc;
    --text-bright:#e0e0ff;
    --text-dim:   #556;
    --snake-head: #00ff88;
    --snake-body: #00bb55;
    --food:       #ff4466;
    --danger:     #ff6688;
    --accent:     #0ff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: "Consolas", "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }

  /* ---- Stage: phone-like frame ---- */
  .stage {
    position: relative;
    width: 800px;
    height: 600px;
    background: var(--bg-deep);
    border: 2px solid #111133;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,255,136,0.06);
  }

  /* ---- Game Board ---- */
  .game-board {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-board canvas {
    border: 3px solid var(--border-hl);
    border-radius: 2px;
    box-shadow: 0 0 20px rgba(0,255,136,0.15), inset 0 0 40px rgba(0,255,136,0.03);
  }

  /* ---- Overlay base ---- */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(6,6,15,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }

  /* ---- Panel card ---- */
  .panel {
    background: var(--bg-panel);
    border: 1px solid #1a1a4e;
    border-radius: 10px;
    padding: 32px 40px;
    min-width: 380px;
    text-align: center;
  }

  /* ---- Typography ---- */
  .title {
    color: var(--text-bright);
    font-size: 28px;
    letter-spacing: 8px;
    margin-bottom: 2px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 9px;
    letter-spacing: 4px;
    margin-bottom: 20px;
  }
  .section-hint {
    color: var(--accent);
    font-size: 10px;
    border: 1px solid #1a1a3e;
    border-radius: 10px;
    padding: 3px 16px;
    display: inline-block;
    margin-bottom: 18px;
  }

  /* ---- Buttons ---- */
  .btn {
    display: block;
    width: 100%;
    background: var(--bg-btn);
    border: 1px solid var(--border-btn);
    border-radius: 5px;
    color: var(--text-main);
    padding: 10px 0;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 6px;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn:hover {
    border-color: var(--border-hl);
    color: var(--border-hl);
  }
  .btn:active { background: #0a0a1e; }

  .btn.primary { color: var(--border-hl); border-color: #225544; }
  .btn.primary:hover { border-color: var(--border-hl); }

  .btn.danger { border-color: #332233; color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    color: var(--text-dim) !important;
    border-color: var(--border-btn) !important;
  }

  /* ---- Footer row (settings / exit) ---- */
  .footer-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 14px;
  }
  .footer-row button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    padding: 4px 12px;
  }
  .footer-row button:hover { color: var(--border-hl); }
  .footer-row button.exit:hover { color: var(--danger); }

  /* ---- Decor snake ---- */
  .decor-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,255,136,0.4), transparent);
    margin: 8px 0;
  }
  .decor-snake {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin: 4px 0;
  }
  .decor-snake .seg {
    width: 8px; height: 8px;
    border-radius: 2px;
  }
  .decor-snake .seg.head { background: var(--snake-head); }
  .decor-snake .seg.body { background: var(--snake-body); }

  /* ---- Game Over ---- */
  .go-title {
    color: var(--danger);
    font-size: 18px;
    letter-spacing: 6px;
    margin-bottom: 6px;
  }
  .go-score {
    color: var(--border-hl);
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .go-stats {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 18px;
  }

  /* ---- Countdown ---- */
  .countdown {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    pointer-events: none;
  }
  .countdown .hint {
    position: absolute;
    bottom: 60px;
    font-size: 18px;
    color: var(--text-dim);
  }
  .countdown .num {
    font-size: 72px;
    color: var(--border-hl);
  }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    border-bottom: 1px solid #1a1a4e;
  }
  .tabs button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 8px 0;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tabs button.active {
    color: var(--border-hl);
    border-bottom-color: var(--border-hl);
  }

  /* ---- Form ---- */
  .form-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .form-row label { color: var(--text-main); }
  .form-row select, .form-row input {
    background: #08081a;
    border: 1px solid #1a1a4e;
    border-radius: 4px;
    color: var(--accent);
    padding: 6px 10px;
    font-family: inherit;
    font-size: 12px;
    width: 160px;
  }
  .form-row select:focus, .form-row input:focus {
    outline: none;
    border-color: var(--border-hl);
  }
  .slider {
    -webkit-appearance: none;
    width: 160px;
    height: 4px;
    background: #1a1a4e;
    border-radius: 2px;
    outline: none;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--border-hl);
    cursor: pointer;
  }

  /* ---- Mode switch bar ---- */
  .mode-switch {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    z-index: 20;
  }
  .mode-switch button {
    background: rgba(13,13,40,0.7);
    border: 1px solid #222255;
    border-radius: 4px;
    color: var(--text-dim);
    padding: 4px 14px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .mode-switch button.active {
    border-color: var(--border-hl);
    color: var(--border-hl);
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- ============================================================
       GAME BOARD (always visible underneath)
       ============================================================ -->
  <div class="game-board">
    <canvas id="board" width="480" height="480"></canvas>
  </div>

  <!-- ============================================================
       MAIN MENU
       ============================================================ -->
  <div class="overlay" id="menu">
    <div class="panel">
      <div class="decor-line"></div>
      <div class="decor-snake">
        <div class="seg head"></div><div class="seg body"></div><div class="seg body"></div>
        <div class="seg body"></div><div class="seg body"></div><div class="seg body"></div>
      </div>
      <div class="decor-line"></div>

      <div class="title">SNAKE ARENA</div>
      <div class="subtitle">MULTI-MODE BATTLE PLATFORM</div>
      <div class="section-hint">▼ SELECT MODE</div>

      <button class="btn primary" onclick="switchMode('menu')">单人经典模式</button>
      <button class="btn" disabled>AI 对战模式</button>
      <button class="btn" disabled>联机对战模式</button>
      <button class="btn" disabled>对局回放</button>

      <div class="footer-row">
        <button onclick="switchMode('settings')">[ 设置 ]</button>
        <button class="exit">[ 退出 ]</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       PAUSE
       ============================================================ -->
  <div class="overlay hidden" id="pause">
    <div class="panel">
      <div class="title" style="font-size:22px;letter-spacing:4px;">游戏暂停</div>
      <div style="height:20px"></div>
      <button class="btn primary">继续游戏</button>
      <button class="btn">重新开始</button>
      <button class="btn">设置</button>
      <div style="height:8px"></div>
      <button class="btn danger">返回主菜单</button>
    </div>
  </div>

  <!-- ============================================================
       GAME OVER
       ============================================================ -->
  <div class="overlay hidden" id="gameover">
    <div class="panel">
      <div class="go-title">游 戏 结 束</div>
      <div class="go-score">42</div>
      <div class="go-stats">长度: 8 &nbsp;|&nbsp; 击杀: 0 &nbsp;|&nbsp; 时间: 1:23</div>
      <button class="btn primary">再来一局</button>
      <button class="btn" disabled>保存回放</button>
      <div style="height:8px"></div>
      <button class="btn danger">返回主菜单</button>
    </div>
  </div>

  <!-- ============================================================
       SETTINGS
       ============================================================ -->
  <div class="overlay hidden" id="settings">
    <div class="panel" style="min-width:420px;">
      <div class="title" style="font-size:22px;letter-spacing:4px;">设 置</div>
      <div style="height:16px"></div>

      <div class="tabs">
        <button class="active" onclick="switchTab(this,'tab-control')">操作</button>
        <button onclick="switchTab(this,'tab-game')">游戏</button>
      </div>

      <!-- Control tab -->
      <div id="tab-control">
        <div class="form-row">
          <label>移动键位:</label>
          <select><option>方向键</option><option>WASD</option></select>
        </div>
        <div class="form-row">
          <label>语言 / Language:</label>
          <select><option>中文</option><option>English</option></select>
        </div>
      </div>

      <!-- Game tab -->
      <div id="tab-game" style="display:none;">
        <div class="form-row">
          <label>游戏速度:</label>
          <select><option>慢</option><option selected>中</option><option>快</option></select>
        </div>
        <div class="form-row">
          <label>棋盘大小:</label>
          <select>
            <option>小 (15×15)</option><option selected>中 (20×20)</option><option>大 (30×30)</option>
          </select>
        </div>
        <div class="form-row">
          <label>音量:</label>
          <input type="range" class="slider" min="0" max="100" value="50">
        </div>
      </div>

      <div style="height:12px"></div>
      <button class="btn" onclick="switchMode('menu')">返回</button>
    </div>
  </div>

  <!-- ============================================================
       COUNTDOWN
       ============================================================ -->
  <div class="countdown" id="countdown" style="display:none;">
    <div class="hint" id="cd-hint">按任意键开始</div>
    <div class="num" id="cd-num" style="display:none;"></div>
  </div>

  <!-- ============================================================
       MODE SWITCH BAR (dev tool)
       ============================================================ -->
  <div class="mode-switch">
    <button class="active" data-mode="menu"    onclick="switchMode('menu')">Menu</button>
    <button data-mode="playing"  onclick="switchMode('playing')">Playing</button>
    <button data-mode="pause"    onclick="switchMode('pause')">Pause</button>
    <button data-mode="gameover" onclick="switchMode('gameover')">GameOver</button>
    <button data-mode="settings" onclick="switchMode('settings')">Settings</button>
    <button data-mode="countdown" onclick="switchMode('countdown')">Countdown</button>
  </div>

</div>

<script>
  // ==============================================================
  // Game Board Rendering
  // ==============================================================
  const COLS = 20, ROWS = 20, CELL = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  // Sample snake
  const snake = [
    {x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10},{x:5,y:10}
  ];
  const food = {x:14, y:8};

  function drawBoard() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let r=0; r<=ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r*CELL); ctx.lineTo(COLS*CELL, r*CELL);
      ctx.stroke();
    }
    for (let c=0; c<=COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, ROWS*CELL);
      ctx.stroke();
    }

    // Food (circle with glow)
    const fx = food.x * CELL + CELL/2, fy = food.y * CELL + CELL/2;
    ctx.save();
    ctx.shadowColor = '#ff4466';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff4466';
    ctx.beginPath();
    ctx.arc(fx, fy, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Snake body (gradient + glow)
    ctx.save();
    for (let i = snake.length-1; i >= 0; i--) {
      const seg = snake[i];
      const t = i / Math.max(snake.length-1, 1);
      const r = Math.round(0x00 + t*(0x00-0x00));
      const g = Math.round(0xff + t*(0xbb-0xff));
      const b = Math.round(0x88 + t*(0x55-0x88));
      const color = `rgb(${r},${g},${b})`;

      const sx = seg.x * CELL + 4, sy = seg.y * CELL + 4;
      const bs = 16; // block size
      const radius = 4;

      ctx.shadowColor = i === 0 ? '#00ff88' : 'transparent';
      ctx.shadowBlur = i === 0 ? 10 : 0;
      ctx.fillStyle = color;
      ctx.strokeStyle = i === 0 ? '#44ffaa' : '#22cc66';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx + radius, sy);
      ctx.lineTo(sx + bs - radius, sy);
      ctx.quadraticCurveTo(sx + bs, sy, sx + bs, sy + radius);
      ctx.lineTo(sx + bs, sy + bs - radius);
      ctx.quadraticCurveTo(sx + bs, sy + bs, sx + bs - radius, sy + bs);
      ctx.lineTo(sx + radius, sy + bs);
      ctx.quadraticCurveTo(sx, sy + bs, sx, sy + bs - radius);
      ctx.lineTo(sx, sy + radius);
      ctx.quadraticCurveTo(sx, sy, sx + radius, sy);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }
  drawBoard();

  // ==============================================================
  // Mode switching
  // ==============================================================
  const overlays = {
    menu:      document.getElementById('menu'),
    pause:     document.getElementById('pause'),
    gameover:  document.getElementById('gameover'),
    settings:  document.getElementById('settings'),
  };
  const cd = document.getElementById('countdown');
  const cdHint = document.getElementById('cd-hint');
  const cdNum = document.getElementById('cd-num');

  function switchMode(mode) {
    // Hide all overlays
    Object.values(overlays).forEach(o => o.classList.add('hidden'));
    cd.style.display = 'none';

    if (mode === 'playing') return; // no overlay

    if (mode === 'countdown') {
      cd.style.display = 'flex';
      cdHint.style.display = 'block';
      cdNum.style.display = 'none';
    } else if (overlays[mode]) {
      overlays[mode].classList.remove('hidden');
    }

    // Update switch bar
    document.querySelectorAll('.mode-switch button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  }

  function switchTab(btn, tabId) {
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-control').style.display = tabId === 'tab-control' ? 'block' : 'none';
    document.getElementById('tab-game').style.display = tabId === 'tab-game' ? 'block' : 'none';
  }

  // Click countdown to cycle: hint → 3 → 2 → 1 → GO → playing
  let cdState = 0;
  cd.addEventListener('click', () => {
    cdState++;
    if (cdState === 1) {
      cdHint.style.display = 'none';
      cdNum.style.display = 'block';
      cdNum.textContent = '3';
    } else if (cdState <= 3) {
      cdNum.textContent = String(4 - cdState);
    } else if (cdState === 4) {
      cdNum.textContent = 'GO!';
      cdNum.style.color = '#ff6688';
    } else {
      switchMode('playing');
      cdState = 0;
      cdNum.style.color = '#00ff88';
    }
  });
</script>

</body>
</html>
