<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Arena — UI Mockup v3</title>
<style>
  :root {
    --bg-deep:    #06060f;
    --bg-panel:   #0a0a1a;
    --bg-btn:     #0d0d28;
    --border-btn: #222255;
    --border-hl:  #00ff88;
    --text-main:  #ccc;
    --text-bright:#e0e0ff;
    --text-dim:   #556;
    --snake-head: #00ff88;
    --snake-body: #00bb55;
    --food:       #ff4466;
    --danger:     #ff6688;
    --accent:     #0ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #020208; color: var(--text-main);
    font-family: "Consolas", "Courier New", monospace;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; user-select: none;
  }
  .stage {
    position: relative; width: 800px; height: 600px;
    background: var(--bg-deep);
    border: 2px solid #111133; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 60px rgba(0,255,136,0.06);
  }

  /* ---- Pages ---- */
  .page { position: absolute; inset: 0; display: none; }
  .page.active { display: block; }

  /* ---- Full-stage overlay (settings) ---- */
  .stage-overlay {
    position: absolute; inset: 0; z-index: 50;
    background: rgba(6,6,15,0.94);
    display: flex; align-items: center; justify-content: center;
  }
  .stage-overlay.hidden { display: none; }

  /* ---- Dev mode bar ---- */
  .dev-bar {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 200;
    opacity: 0.5; transition: opacity 0.2s;
  }
  .dev-bar:hover { opacity: 1; }
  .dev-bar button {
    background: rgba(13,13,40,0.6); border: 1px solid rgba(34,34,85,0.5);
    border-radius: 3px; color: var(--text-dim); padding: 2px 10px;
    font-family: inherit; font-size: 10px; cursor: pointer;
  }
  .dev-bar button.active { border-color: var(--border-hl); color: var(--border-hl); }

  /* ============================================================
     PAGE 0: MAIN MENU
     ============================================================ */
  .menu-bg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-bg canvas { border-radius: 2px; opacity: 0.35; }
  .menu-overlay {
    position: absolute; inset: 0;
    background: rgba(6,6,15,0.88);
    display: flex; align-items: center; justify-content: center;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid #1a1a4e; border-radius: 10px;
    padding: 32px 40px; min-width: 380px; text-align: center;
  }
  .title {
    color: var(--text-bright); font-size: 28px;
    letter-spacing: 8px; margin-bottom: 2px;
  }
  .subtitle {
    color: var(--text-dim); font-size: 9px;
    letter-spacing: 4px; margin-bottom: 20px;
  }
  .section-hint {
    color: var(--accent); font-size: 10px;
    border: 1px solid #1a1a3e; border-radius: 10px;
    padding: 3px 16px; display: inline-block; margin-bottom: 18px;
  }
  .btn {
    display: block; width: 100%;
    background: var(--bg-btn); border: 1px solid var(--border-btn);
    border-radius: 5px; color: var(--text-main);
    padding: 10px 0; font-size: 14px; font-family: inherit;
    cursor: pointer; margin-bottom: 6px;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn:hover { border-color: var(--border-hl); color: var(--border-hl); }
  .btn:active { background: #0a0a1e; }
  .btn.primary { color: var(--border-hl); border-color: #225544; }
  .btn.primary:hover { border-color: var(--border-hl); }
  .btn.danger { border-color: #332233; color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; color: var(--text-dim) !important; border-color: var(--border-btn) !important; }

  .footer-row { display: flex; justify-content: center; gap: 16px; margin-top: 14px; }
  .footer-row button {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 11px; font-family: inherit; cursor: pointer; padding: 4px 12px;
  }
  .footer-row button:hover { color: var(--border-hl); }
  .footer-row button.exit:hover { color: var(--danger); }
  .decor-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,255,136,0.4), transparent);
    margin: 8px 0;
  }
  .decor-snake { display: flex; justify-content: center; gap: 4px; margin: 4px 0; }
  .decor-snake .seg { width: 8px; height: 8px; border-radius: 2px; }
  .decor-snake .seg.head { background: var(--snake-head); }
  .decor-snake .seg.body { background: var(--snake-body); }

  /* ============================================================
     PAGE 1: GAME PAGE
     ============================================================ */
  .game-area {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
  }

  /* ---- HUD ---- */
  .hud {
    display: flex; align-items: center; justify-content: center;
    gap: 28px; padding: 12px 20px;
    background: rgba(6,6,15,0.92);
    border-bottom: 1px solid rgba(0,255,136,0.12);
    z-index: 2; position: relative;
  }
  .hud-item { text-align: center; }
  .hud-label { color: var(--text-dim); font-size: 8px; letter-spacing: 2px; text-transform: uppercase; }
  .hud-value { color: var(--text-bright); font-size: 20px; font-weight: bold; }
  .hud-value.accent { color: var(--border-hl); }
  .hud-value.danger { color: var(--danger); }
  .hud-divider {
    width: 1px; height: 28px;
    background: linear-gradient(180deg, transparent, rgba(0,255,136,0.2), transparent);
  }

  /* ---- Board ---- */
  .board-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .board-wrap canvas {
    border: 3px solid var(--border-hl);
    border-radius: 2px;
    box-shadow: 0 0 20px rgba(0,255,136,0.15), inset 0 0 40px rgba(0,255,136,0.03);
  }

  /* ---- In-board overlays (pause / gameover / countdown) ---- */
  .board-overlay {
    position: absolute; inset: 0;
    background: rgba(6,6,15,0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .board-overlay.hidden { display: none; }

  /* ---- Game Over ---- */
  .go-title { color: var(--danger); font-size: 18px; letter-spacing: 6px; margin-bottom: 6px; }
  .go-score { color: var(--border-hl); font-size: 36px; font-weight: bold; margin-bottom: 2px; }
  .go-stats { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }

  /* ---- Countdown ---- */
  .countdown-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 8; pointer-events: none;
    background: rgba(6,6,15,0.55);
  }
  .countdown-overlay.hidden { display: none; }
  .countdown-hint-wrap {
    position: absolute; bottom: 60px;
    font-size: 18px;
  }
  .countdown-num {
    font-size: 72px; color: var(--border-hl);
  }

  /* ---- Shine animation (反光扫过文字) ---- */
  @keyframes shine {
    0%   { background-position: -300% center; }
    100% { background-position: 300% center; }
  }
  .text-shine {
    background: linear-gradient(
      110deg,
      var(--text-dim) 0%,
      var(--text-dim) 35%,
      var(--border-hl) 45%,
      var(--accent) 50%,
      var(--border-hl) 55%,
      var(--text-dim) 65%,
      var(--text-dim) 100%
    );
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 2.2s ease-in-out infinite;
  }

  /* ---- Settings panel (fresh design, not "like main menu") ---- */
  .settings-panel {
    background: var(--bg-panel);
    border: 1px solid #1a1a4e; border-radius: 10px;
    padding: 32px 44px; min-width: 440px; text-align: center;
    position: relative;
  }
  .settings-panel .title {
    font-size: 22px; letter-spacing: 6px;
    margin-bottom: 20px;
  }
  .tabs {
    display: flex; gap: 0; margin-bottom: 20px;
    border-bottom: 1px solid #1a1a4e;
  }
  .tabs button {
    flex: 1; background: transparent; border: none;
    color: var(--text-dim); padding: 8px 0;
    font-family: inherit; font-size: 13px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tabs button.active { color: var(--border-hl); border-bottom-color: var(--border-hl); }

  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label {
    display: block; color: var(--text-dim);
    font-size: 10px; letter-spacing: 2px;
    margin-bottom: 6px; text-transform: uppercase;
  }
  .form-group select, .form-group input[type=range] {
    width: 100%;
    background: #08081a; border: 1px solid #1a1a4e; border-radius: 4px;
    color: var(--accent); padding: 8px 12px;
    font-family: inherit; font-size: 13px;
  }
  .form-group select:focus { outline: none; border-color: var(--border-hl); }
  .form-group select option { background: #0a0a1a; color: var(--text-main); }

  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  .slider-wrap input[type=range] { flex: 1; }
  .slider-wrap .val { color: var(--border-hl); font-size: 13px; min-width: 32px; text-align: right; }

  input[type=range] {
    -webkit-appearance: none; height: 4px;
    background: #1a1a4e; border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--border-hl); cursor: pointer;
  }

  .settings-back {
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- ============================================================
       DEV BAR
       ============================================================ -->
  <div class="dev-bar">
    <button class="active" data-mode="menu"     onclick="switchTo('menu')">Menu</button>
    <button data-mode="playing"  onclick="switchTo('playing')">Playing</button>
    <button data-mode="pause"    onclick="switchTo('pause')">Pause</button>
    <button data-mode="gameover" onclick="switchTo('gameover')">GameOver</button>
    <button data-mode="settings" onclick="switchTo('settings')">Settings</button>
    <button data-mode="countdown" onclick="switchTo('countdown')">3-2-1</button>
  </div>

  <!-- ============================================================
     PAGE 0: MAIN MENU
     ============================================================ -->
  <div class="page active" id="page-menu">
    <div class="menu-bg"><canvas id="bg-canvas" width="480" height="480"></canvas></div>
    <div class="menu-overlay">
      <div class="panel">
        <div class="decor-line"></div>
        <div class="decor-snake">
          <div class="seg head"></div><div class="seg body"></div><div class="seg body"></div>
          <div class="seg body"></div><div class="seg body"></div><div class="seg body"></div>
        </div>
        <div class="decor-line"></div>
        <div class="title">SNAKE ARENA</div>
        <div class="subtitle">MULTI-MODE BATTLE PLATFORM</div>
        <div class="section-hint">▼ SELECT MODE</div>
        <button class="btn primary" onclick="switchTo('countdown')">单人经典模式</button>
        <button class="btn" disabled>AI 对战模式</button>
        <button class="btn" disabled>联机对战模式</button>
        <button class="btn" disabled>对局回放</button>
        <div class="footer-row">
          <button onclick="switchTo('settings')">[ 设置 ]</button>
          <button class="exit">[ 退出 ]</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
     PAGE 1: GAME PAGE
     ============================================================ -->
  <div class="page" id="page-game">
    <div class="game-area">
      <!-- HUD -->
      <div class="hud">
        <div class="hud-item">
          <div class="hud-label">Score</div>
          <div class="hud-value accent" id="hud-score">0</div>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
          <div class="hud-label">Length</div>
          <div class="hud-value" id="hud-length">3</div>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
          <div class="hud-label">Time</div>
          <div class="hud-value" id="hud-time">00:42</div>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
          <div class="hud-label">Speed</div>
          <div class="hud-value" id="hud-speed" style="font-size:14px;">MID</div>
        </div>
        <div class="hud-divider" id="hud-div-kills" style="display:none;"></div>
        <div class="hud-item" id="hud-item-kills" style="display:none;">
          <div class="hud-label">Kills</div>
          <div class="hud-value danger" id="hud-kills">0</div>
        </div>
        <div class="hud-divider" id="hud-div-rank" style="display:none;"></div>
        <div class="hud-item" id="hud-item-rank" style="display:none;">
          <div class="hud-label">Rank</div>
          <div class="hud-value accent" id="hud-rank" style="font-size:14px;">1 / 4</div>
        </div>
      </div>

      <!-- Board -->
      <div class="board-wrap">
        <canvas id="game-canvas" width="480" height="480"></canvas>

        <!-- Pause overlay (covers board only) -->
        <div class="board-overlay hidden" id="pause-overlay">
          <div class="panel">
            <div class="title" style="font-size:22px;letter-spacing:4px;">游戏暂停</div>
            <div style="height:20px"></div>
            <button class="btn primary">继续游戏</button>
            <button class="btn">重新开始</button>
            <button class="btn">设置</button>
            <div style="height:8px"></div>
            <button class="btn danger">返回主菜单</button>
          </div>
        </div>

        <!-- GameOver overlay (covers board only) -->
        <div class="board-overlay hidden" id="go-overlay">
          <div class="panel">
            <div class="go-title">游 戏 结 束</div>
            <div class="go-score" id="go-score">42</div>
            <div class="go-stats" id="go-stats">长度: 8 &nbsp;|&nbsp; 击杀: 0 &nbsp;|&nbsp; 时间: 1:23</div>
            <button class="btn primary">再来一局</button>
            <button class="btn" disabled>保存回放</button>
            <div style="height:8px"></div>
            <button class="btn danger">返回主菜单</button>
          </div>
        </div>

        <!-- Countdown overlay (covers board only) -->
        <div class="countdown-overlay hidden" id="countdown-overlay">
          <div class="countdown-hint-wrap" id="cd-hint-wrap">
            <span class="text-shine">按 任 意 键 开 始</span>
          </div>
          <div class="countdown-num" id="cd-num" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
     SETTINGS (full-stage overlay, sits above everything)
     ============================================================ -->
  <div class="stage-overlay hidden" id="settings-overlay">
    <div class="settings-panel">
      <div class="title">设 置</div>

      <div class="tabs">
        <button class="active" onclick="switchTab(this,'tab-control')">操作</button>
        <button onclick="switchTab(this,'tab-game')">游戏</button>
      </div>

      <div id="tab-control">
        <div class="form-group">
          <label>移动键位</label>
          <select><option>方向键 (↑ ↓ ← →)</option><option>WASD</option></select>
        </div>
        <div class="form-group">
          <label>语言 / Language</label>
          <select><option>中文</option><option>English</option></select>
        </div>
      </div>

      <div id="tab-game" style="display:none;">
        <div class="form-group">
          <label>游戏速度</label>
          <select><option>慢 (150ms)</option><option selected>中 (100ms)</option><option>快 (60ms)</option></select>
        </div>
        <div class="form-group">
          <label>棋盘大小</label>
          <select><option>小 (15×15)</option><option selected>中 (20×20)</option><option>大 (30×30)</option></select>
        </div>
        <div class="form-group">
          <label>音量</label>
          <div class="slider-wrap">
            <input type="range" min="0" max="100" value="50" oninput="this.nextElementSibling.textContent=this.value">
            <span class="val">50</span>
          </div>
        </div>
      </div>

      <div class="settings-back">
        <button class="btn" onclick="closeSettings()">返回</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ==============================================================
  // Board renderer
  // ==============================================================
  const COLS = 20, ROWS = 20, CELL = 24;
  function drawBoard(canvasId, alpha) {
    const c = document.getElementById(canvasId);
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5;
    for (let r=0; r<=ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(COLS*CELL, r*CELL); ctx.stroke(); }
    for (let col=0; col<=COLS; col++) { ctx.beginPath(); ctx.moveTo(col*CELL, 0); ctx.lineTo(col*CELL, ROWS*CELL); ctx.stroke(); }

    const fx = 14 * CELL + CELL/2, fy = 8 * CELL + CELL/2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = '#ff4466'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff4466';
    ctx.beginPath(); ctx.arc(fx, fy, 6, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    const snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10},{x:5,y:10}];
    ctx.save(); ctx.globalAlpha = alpha;
    for (let i = snake.length-1; i >= 0; i--) {
      const seg = snake[i];
      const t = i / Math.max(snake.length-1, 1);
      const g = Math.round(0xff + t*(0xbb-0xff));
      const b = Math.round(0x88 + t*(0x55-0x88));
      const color = `rgb(0,${g},${b})`;
      const sx = seg.x * CELL + 4, sy = seg.y * CELL + 4;
      const bs = 16, radius = 4;
      ctx.shadowColor = i === 0 ? '#00ff88' : 'transparent';
      ctx.shadowBlur = i === 0 ? 10 : 0;
      ctx.fillStyle = color;
      ctx.strokeStyle = i === 0 ? '#44ffaa' : '#22cc66'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx+radius, sy); ctx.lineTo(sx+bs-radius, sy);
      ctx.quadraticCurveTo(sx+bs, sy, sx+bs, sy+radius);
      ctx.lineTo(sx+bs, sy+bs-radius);
      ctx.quadraticCurveTo(sx+bs, sy+bs, sx+bs-radius, sy+bs);
      ctx.lineTo(sx+radius, sy+bs);
      ctx.quadraticCurveTo(sx, sy+bs, sx, sy+bs-radius);
      ctx.lineTo(sx, sy+radius);
      ctx.quadraticCurveTo(sx, sy, sx+radius, sy);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // ==============================================================
  // Mode switching
  // ==============================================================
  let cdState = 0;

  function switchTo(mode) {
    const menuPage = document.getElementById('page-menu');
    const gamePage = document.getElementById('page-game');
    const pauseOv   = document.getElementById('pause-overlay');
    const goOv      = document.getElementById('go-overlay');
    const cdOv      = document.getElementById('countdown-overlay');
    const settingsOv= document.getElementById('settings-overlay');

    const needsGamePage = ['playing','pause','gameover','countdown'].includes(mode);

    if (needsGamePage) {
      gamePage.classList.add('active');
      menuPage.classList.remove('active');
    } else {
      menuPage.classList.add('active');
      gamePage.classList.remove('active');
      drawBoard('bg-canvas', 0.35);
    }

    // Hide board-level overlays
    [pauseOv, goOv, cdOv].forEach(o => o.classList.add('hidden'));
    // Settings is stage-level, close it unless explicitly opened
    if (mode !== 'settings') settingsOv.classList.add('hidden');

    if (mode === 'pause')    pauseOv.classList.remove('hidden');
    if (mode === 'gameover') goOv.classList.remove('hidden');

    if (mode === 'countdown') {
      cdOv.classList.remove('hidden');
      document.getElementById('cd-hint-wrap').style.display = 'block';
      document.getElementById('cd-num').style.display = 'none';
      cdState = 0;
    }

    if (mode === 'settings') {
      settingsOv.classList.remove('hidden');
    }

    if (mode === 'playing') {
      drawBoard('game-canvas', 1.0);
    }

    document.querySelectorAll('.dev-bar button').forEach(b =>
      b.classList.toggle('active', b.dataset.mode === mode)
    );
  }

  function closeSettings() {
    document.getElementById('settings-overlay').classList.add('hidden');
  }

  // Settings tab switch
  function switchTab(btn, tabId) {
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-control').style.display = tabId === 'tab-control' ? 'block' : 'none';
    document.getElementById('tab-game').style.display = tabId === 'tab-game' ? 'block' : 'none';
  }

  // Countdown cycle
  document.getElementById('countdown-overlay').addEventListener('click', () => {
    cdState++;
    const hintWrap = document.getElementById('cd-hint-wrap');
    const num = document.getElementById('cd-num');
    if (cdState === 1) {
      hintWrap.style.display = 'none'; num.style.display = 'block'; num.textContent = '3';
    } else if (cdState <= 3) {
      num.textContent = String(4 - cdState);
    } else if (cdState === 4) {
      num.textContent = 'GO!'; num.style.color = '#ff6688';
    } else {
      num.style.color = '#00ff88'; switchTo('playing'); cdState = 0;
    }
  });

  // Init
  drawBoard('bg-canvas', 0.35);
</script>
</body>
</html>
